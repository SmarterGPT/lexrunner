name: Guard release tags

on:
  push:
    tags:
      - "v*"
      - "lexrunner-v*"

permissions:
  contents: read

jobs:
  block:
    name: Validate release tag format
    runs-on: ubuntu-latest
    steps:
      - name: Check tag format
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          TAG=${TAG_REF#refs/tags/}
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Valid release tag: $TAG"
            exit 0
          fi
          echo "New release tags must use vX.Y.Z: $TAG" >&2
          echo "Existing historical tags remain immutable; do not delete or replace them." >&2
          exit 1
