name: Release

on:
  push:
    branches:
      - main
    tags:
      # Stable releases on version tags
      # Tag format: v*.*.* (e.g., v0.1.0, v1.0.0)
      - "v*.*.*"

  # Manual release trigger
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - canary
          - stable
        default: "canary"

permissions:
  contents: read

jobs:
  # Canary release job - runs on main branch pushes
  canary-release:
    name: Canary Release
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      !startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history for proper versioning

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check determinism
        run: |
          npm run format
          if ! git diff --exit-code; then
            echo "❌ Build is not deterministic"
            exit 1
          fi

      - name: Generate canary version
        id: canary_version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          COMMIT_SHA=$(git rev-parse --short HEAD)
          CANARY_VERSION="${CURRENT_VERSION}-canary.${COMMIT_SHA}"
          echo "version=${CANARY_VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Canary version: ${CANARY_VERSION}"

      - name: Update version for canary
        run: |
          npm version ${{ steps.canary_version.outputs.version }} --no-git-tag-version

      - name: Create canary release summary
        run: |
          echo "## 🚀 Canary Candidate Prepared" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.canary_version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation after an authorized npm publish" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install @smartergpt/lexrunner@canary" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ⚠️ npm publication is disabled in this workflow pending #795. Canary releases are for testing only." >> $GITHUB_STEP_SUMMARY

  # Stable release job - runs on version tags
  stable-release:
    name: Stable Release
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag format
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Tag must follow format: v*.*.* (e.g., v1.2.3)"
            exit 1
          fi
          echo "✅ Tag format is valid: $TAG_NAME"

      - name: Verify release-owner tag and commit signatures and main ancestry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SIGNER_FINGERPRINT: 65C94BA03E88F53D365C36CF7145A1CE635B1902
          RELEASE_SIGNER_KEY_ID: 7145A1CE635B1902
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          TAG_OBJECT_TYPE=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" --jq '.object.type')
          TAG_OBJECT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" --jq '.object.sha')

          if [ "$TAG_OBJECT_TYPE" != "tag" ]; then
            echo "❌ Stable publication requires a signed annotated tag"
            exit 1
          fi

          TAG_OBJECT=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT_SHA}")
          VERIFIED=$(jq -r '.verification.verified' <<< "$TAG_OBJECT")
          REASON=$(jq -r '.verification.reason' <<< "$TAG_OBJECT")
          API_TARGET_TYPE=$(jq -r '.object.type' <<< "$TAG_OBJECT")
          API_TARGET_SHA=$(jq -r '.object.sha' <<< "$TAG_OBJECT")
          if [ "$VERIFIED" != "true" ]; then
            echo "❌ GitHub did not verify the tag signature (reason: ${REASON})"
            exit 1
          fi

          if [ "$API_TARGET_TYPE" != "commit" ] || [ "$API_TARGET_SHA" != "$GITHUB_SHA" ]; then
            echo "❌ Verified tag target (${API_TARGET_TYPE}:${API_TARGET_SHA}) does not match the workflow commit ($GITHUB_SHA)"
            exit 1
          fi

          TAG_TARGET=$(git rev-list -n 1 "$TAG_NAME")
          if [ "$TAG_TARGET" != "$GITHUB_SHA" ]; then
            echo "❌ Tag target ($TAG_TARGET) does not match checked-out commit ($GITHUB_SHA)"
            exit 1
          fi

          # Use an isolated keyring containing only the authorized release-owner key.
          GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"
          export GNUPGHOME
          RELEASE_PUBLIC_KEY=$(mktemp)
          TAG_STATUS_FILE=$(mktemp)
          trap 'rm -rf "$GNUPGHOME" "$RELEASE_PUBLIC_KEY" "$TAG_STATUS_FILE"' EXIT
          gh api users/Guffawaffle/gpg_keys \
            --jq ".[] | select(.key_id == \"${RELEASE_SIGNER_KEY_ID}\") | .raw_key" \
            > "$RELEASE_PUBLIC_KEY"
          if [ ! -s "$RELEASE_PUBLIC_KEY" ]; then
            echo "❌ Release-owner public signing key is unavailable from GitHub"
            exit 1
          fi
          gpg --batch --import "$RELEASE_PUBLIC_KEY"
          IMPORTED_PRIMARY_FINGERPRINT=$(gpg --batch --with-colons --fingerprint "$RELEASE_SIGNER_KEY_ID" | awk -F: '$1 == "fpr" { print $10; exit }')
          if [ "$IMPORTED_PRIMARY_FINGERPRINT" != "$RELEASE_SIGNER_FINGERPRINT" ]; then
            echo "❌ Imported signing key ($IMPORTED_PRIMARY_FINGERPRINT) is not the authorized release owner"
            exit 1
          fi

          if ! git -c gpg.format=openpgp -c gpg.program=/usr/bin/gpg \
            verify-tag --raw "$TAG_NAME" 2> "$TAG_STATUS_FILE"; then
            echo "❌ Release tag does not have a valid GPG signature"
            exit 1
          fi
          VALIDSIG_COUNT=$(grep -c '^\[GNUPG:\] VALIDSIG ' "$TAG_STATUS_FILE" || true)
          if [ "$VALIDSIG_COUNT" -ne 1 ]; then
            echo "❌ Release tag must produce exactly one valid-signature identity"
            exit 1
          fi
          TAG_SIGNER_FINGERPRINT=$(awk '/^\[GNUPG:\] VALIDSIG / { print $NF }' "$TAG_STATUS_FILE")
          if [ "$TAG_SIGNER_FINGERPRINT" != "$RELEASE_SIGNER_FINGERPRINT" ]; then
            echo "❌ Release tag signer ($TAG_SIGNER_FINGERPRINT) is not the authorized release owner"
            exit 1
          fi

          COMMIT_VERIFIED=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${GITHUB_SHA}" --jq '.verification.verified')
          COMMIT_REASON=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${GITHUB_SHA}" --jq '.verification.reason')
          if [ "$COMMIT_VERIFIED" != "true" ]; then
            echo "❌ GitHub did not verify the release commit signature (reason: ${COMMIT_REASON})"
            exit 1
          fi

          if ! git -c gpg.format=openpgp -c gpg.program=/usr/bin/gpg verify-commit "$GITHUB_SHA"; then
            echo "❌ Release commit does not have a valid GPG signature"
            exit 1
          fi
          COMMIT_SIGNER_FINGERPRINT=$(git -c gpg.format=openpgp -c gpg.program=/usr/bin/gpg log -1 --format='%GP' "$GITHUB_SHA")
          if [ "$COMMIT_SIGNER_FINGERPRINT" != "$RELEASE_SIGNER_FINGERPRINT" ]; then
            echo "❌ Release commit signer ($COMMIT_SIGNER_FINGERPRINT) is not the authorized release owner"
            exit 1
          fi

          MAIN_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          ANCESTRY_STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${MAIN_SHA}" --jq '.status')
          if [ "$ANCESTRY_STATUS" != "ahead" ] && [ "$ANCESTRY_STATUS" != "identical" ]; then
            echo "❌ Signed release commit is not contained in origin/main"
            exit 1
          fi
          echo "✅ Release-owner tag and commit signatures and main ancestry are verified"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check determinism
        run: |
          npm run format
          if ! git diff --exit-code; then
            echo "❌ Build is not deterministic"
            exit 1
          fi

      - name: Verify version matches tag
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          TAG_VERSION=${TAG_NAME#v}
          PKG_VERSION=$(node -p "require('./package.json').version")

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "✅ Version match confirmed: $TAG_VERSION"

      - name: Validate npm publication candidate
        run: npm run release:publish:check

      - name: Extract changelog for this version
        id: changelog
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          TAG_VERSION=${TAG_NAME#v}

          # Extract changelog section for this version (exclude section headers)
          awk "/## \[${TAG_VERSION}\]/{flag=1; next} /## \[/{flag=0} flag" CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "No changelog entry found for version ${TAG_VERSION}" > release_notes.md
          fi

      - name: Publish public package through npm trusted publishing
        run: npm publish --access public --tag latest --json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --title "Release ${GITHUB_REF_NAME}" --notes-file release_notes.md

      - name: Create release summary
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          TAG_VERSION=${TAG_NAME#v}

          echo "## 🎉 Stable Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${TAG_VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${TAG_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### npm trusted publication" >> $GITHUB_STEP_SUMMARY
          echo "The signed-tag workflow published through npm's GitHub OIDC trusted publisher." >> $GITHUB_STEP_SUMMARY
          echo "No long-lived npm token was used." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation after an authorized npm publish" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install @smartergpt/lexrunner@${TAG_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release Notes" >> $GITHUB_STEP_SUMMARY
          cat release_notes.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> npm publication was authorized only for this verified signed stable tag." >> $GITHUB_STEP_SUMMARY

  # Manual release job - for workflow_dispatch events
  manual-release:
    name: Manual Release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Manual release info
        run: |
          echo "## 📋 Manual Release Workflow" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** \`${{ github.event.inputs.release_type }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event.inputs.release_type }}" == "stable" ]; then
            echo "1. Run \`npm run release:prepare\` locally" >> $GITHUB_STEP_SUMMARY
            echo "2. Review and commit changes" >> $GITHUB_STEP_SUMMARY
            echo "3. Create signed tag: \`git tag -s vX.Y.Z -m 'Release X.Y.Z'\`" >> $GITHUB_STEP_SUMMARY
            echo "4. Push tag: \`git push origin vX.Y.Z\`" >> $GITHUB_STEP_SUMMARY
            echo "5. The signed-tag workflow validates and publishes through npm trusted publishing" >> $GITHUB_STEP_SUMMARY
            echo "6. Verify the private registry and native Windows consumer" >> $GITHUB_STEP_SUMMARY
          else
            echo "Canary candidates are validated on main branch pushes; npm publication remains a separate authorized step" >> $GITHUB_STEP_SUMMARY
          fi
