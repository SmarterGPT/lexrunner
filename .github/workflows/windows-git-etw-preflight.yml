name: Windows Git ETW tool preflight only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-git-etw-tool-preflight
  cancel-in-progress: false

jobs:
  tool-preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inspect xperf tooling without starting ETW
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File .\scripts\Windows-GitEtwPreflight.ps1
      - name: Stage only bounded preflight evidence
        id: artifact_bounds
        if: always()
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File .\scripts\Test-Windows-GitEtwArtifactBounds.ps1
      - name: Retain bounded preflight receipt and help grammar
        if: always() && steps.artifact_bounds.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-git-etw-tool-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\lexrunner-etw-upload-${{ github.run_id }}-${{ github.run_attempt }}\*
          if-no-files-found: error
          retention-days: 1
