# PR CI: lint, typecheck, build, sharded tests, Git integration, and package artifacts.
# workflow_dispatch retains lower-cost manual levels for diagnosis.
# Local equivalents:
#   minimal: npm run ci:minimal
#   standard: npm run ci
#   full: npm run ci:full
name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "src/**"
      - "tests/**"
      - "proofs/windows-workspace-boundary/**"
      - "services/windows-coordinator-host/**"
      - "services/windows-coordinator-client/**"
      - "services/windows-coordinator-service/**"
      - "services/windows-coordinator-worker-slot/**"
      - "services/windows-coordinator-admission/**"
      - "services/windows-coordinator-git/**"
      - "services/windows-coordinator-checkout/**"
      - "services/windows-coordinator-installed-readback/**"
      - "services/windows-coordinator-job/**"
      - "services/windows-coordinator-root-provisioner/**"
      - "services/windows-coordinator-selection-provisioner/**"
      - "services/windows-coordinator-selection-publisher/**"
      - "services/windows-coordinator-selection-custody/**"
      - "installers/windows-coordinator/**"
      - "scripts/*WindowsCoordinator*.ps1"
      - "scripts/*windows-coordinator*.ts"
      - "scripts/Windows-GitEtwPreflight.ps1"
      - "scripts/Test-Windows-GitEtwNoisyTool.ps1"
      - "docs/architecture/windows-coordinator-*.md"
      - "package*.json"
      - "tsconfig*.json"
      - ".github/workflows/**"
      - "vitest.config.ts"
      - "tsup.config.ts"
  workflow_dispatch:
    inputs:
      level:
        description: "CI level to run"
        required: false
        type: choice
        options:
          - minimal
          - standard
          - full
        default: "minimal"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  # Setup job - install dependencies once, cache for all jobs
  setup:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Cache node_modules
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

  # Minimal gates: lint + typecheck (always runs)
  lint:
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm run typecheck

  # Standard gates: build + sharded test suite. Required on every non-draft PR.
  build-and-test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.level == 'standard' || inputs.level == 'full'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1/3
            artifact: 1-of-3
          - shard: 2/3
            artifact: 2-of-3
          - shard: 3/3
            artifact: 3-of-3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - name: Run test shard with JSON output
        run: npm test -- --shard=${{ matrix.shard }}
        continue-on-error: true
        id: test-run
      - name: Upload test shard result
        if: always() && steps.test-run.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.artifact }}
          path: test-results.json
          if-no-files-found: error
      - name: Fail if tests failed
        if: steps.test-run.outcome == 'failure'
        run: exit 1

  # Git-backed lifecycle and recovery coverage. Required on every non-draft PR.
  git-backed-tests:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.level == 'full')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm run build
      - run: npm run test:git

  # Build-artifact/package boundary validation. Required on every non-draft PR.
  package-artifacts:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.level == 'full')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Activate qualified package-policy npm
        run: npm install --global npm@11.16.0 --ignore-scripts
      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm run build
      - run: npm run validate:package
      - run: npm run test:package
      - run: npm pack --dry-run --json > npm-pack-dry-run.json
      - uses: actions/upload-artifact@v7
        with:
          name: npm-pack-dry-run
          path: npm-pack-dry-run.json

  # Native Windows bootstrap, portable regressions, and a source-built shared broker
  # slice through verify-removal.ps1. Full native-host conformance remains #893 work.
  windows-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.level != 'minimal')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: "proofs/windows-workspace-boundary/global.json"
      - name: Activate pinned npm
        run: npm install --global npm@11.16.0
      - name: Install dependencies
        run: npm ci
      - name: Verify install-script policy
        run: npm run check:install-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint and typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Run portable Windows regressions
        run: >-
          npx vitest run
          tests/unit/verification/engine-verifier.spec.ts
          tests/dogfood-ecosystem.spec.ts
          tests/release-readiness.spec.ts
          tests/runs/agent-work-containment-preflight.spec.ts
          tests/runs/agent-work-preparation-service.spec.ts
          tests/workspaces/workspace-boundary-resolver.spec.ts
          tests/workspaces/workspace-boundary.spec.ts
          tests/store/sqlite/removal-evidence-interruption.spec.ts
      - name: Verify inactive Windows coordinator graph and selection source
        run: >-
          npx --no-install vitest run
          tests/workspaces/windows-coordinator-generation-graph.spec.ts
          tests/workspaces/windows-coordinator-generation-payload.spec.ts
          tests/workspaces/windows-coordinator-active-selection.spec.ts
          tests/workspaces/windows-coordinator-active-selection-reader.spec.ts
          tests/workspaces/windows-coordinator-active-selection-acquisition.spec.ts
          tests/workspaces/windows-coordinator-active-selection-v2.spec.ts
          tests/workspaces/windows-coordinator-active-selection-v2-reader.spec.ts
          tests/workspaces/windows-coordinator-active-selection-v2-acquisition.spec.ts
      - name: Qualify inactive Windows coordinator v3 worker graph source
        shell: pwsh
        run: ./installers/windows-coordinator/v3/verify.ps1
      - name: Verify inactive Windows coordinator admission bundle and journal
        run: >-
          npx --no-install vitest run
          --testTimeout=30000
          --hookTimeout=60000
          tests/windows-coordinator/bundled-admission-probe.spec.ts
          services/windows-coordinator-admission/synthetic-uncertainty-journal.spec.ts
          tests/windows-coordinator/admission-store.spec.ts
          tests/store/sqlite/coordination-store.spec.ts
          tests/store/sqlite/workspace-lifecycle-store.spec.ts
      - name: Verify inactive Windows coordinator selection publication model
        run: npx --no-install vitest run services/windows-coordinator-selection-provisioner/synthetic-publication.spec.ts
      - name: Qualify native Windows coordinator console peer probe
        shell: pwsh
        run: ./services/windows-coordinator-host/verify.ps1
      - name: Qualify native Windows coordinator client source
        shell: pwsh
        run: ./services/windows-coordinator-client/verify.ps1
      - name: Verify inactive coordinator installed-readback source contract
        shell: pwsh
        run: |
          $result = ./services/windows-coordinator-installed-readback/Read-InstalledCoordinator.ps1 -SelfTest | ConvertFrom-Json
          if ($result.schemaVersion -cne 'windows-coordinator-installed-readback/1' -or
              $result.state -cne 'unavailable' -or
              $result.reason -cne 'synthetic_contract_pass' -or
              $result.authorizesExecution -ne $false -or
              $result.productionReady -ne $false -or
              $result.helperMissingCleared -ne $false -or
              $result.sourceOnly -ne $true) {
            throw 'Installed-readback source contract made an unsupported authority claim'
          }
      - name: Qualify fail-closed Windows coordinator service source
        shell: pwsh
        run: ./services/windows-coordinator-service/verify.ps1
      - name: Qualify inactive Windows worker-slot source
        shell: pwsh
        run: ./services/windows-coordinator-worker-slot/verify.ps1
      - name: Qualify inactive Windows coordinator protected-root source
        shell: pwsh
        run: ./services/windows-coordinator-root-provisioner/verify-portable.ps1
      - name: Qualify inactive Windows coordinator selection publisher source
        shell: pwsh
        run: ./services/windows-coordinator-selection-publisher/verify.ps1
      - name: Qualify inactive Windows coordinator selection custody source
        shell: pwsh
        run: ./services/windows-coordinator-selection-custody/verify.ps1
      - name: Qualify inactive graph-selected Windows Git source build
        shell: pwsh
        run: ./services/windows-coordinator-git/verify-portable.ps1
      - name: Qualify inactive Windows coordinator checkout source build
        shell: pwsh
        run: ./services/windows-coordinator-checkout/verify-portable.ps1
      - name: Qualify non-installable Windows coordinator v2 MSI source offline
        shell: pwsh
        run: |
          $id = [guid]::NewGuid().ToString('N')
          $artifact = Join-Path $PWD "artifacts/windows-coordinator-v2-msi-offline/source-$id"
          ./installers/windows-coordinator/v2/verify.ps1 -ArtifactDirectory $artifact
      - name: Verify Windows Git ETW diagnostic bounds without starting ETW
        shell: pwsh
        run: ./scripts/Test-Windows-GitEtwNoisyTool.ps1
      - name: Run native Windows handle-authority proof
        shell: pwsh
        run: ./proofs/windows-workspace-boundary/verify.ps1
      - name: Qualify actual native removal and recovery
        shell: pwsh
        run: ./proofs/windows-workspace-boundary/verify-removal.ps1
      - name: Qualify MSI packaging without installation
        shell: pwsh
        run: ./scripts/Test-WindowsHelperMsi.ps1 -HelperExecutable (Join-Path $PWD 'proofs/windows-workspace-boundary/artifacts/removal/ntfs/helper/lexrunner-windows-boundary-helper.exe') -ArtifactDirectory (Join-Path $PWD 'artifacts/windows-helper-msi-ci')
      - name: Qualify real MSI lifecycle on the disposable hosted runner
        shell: pwsh
        run: |
          $fixture = Get-Content artifacts/windows-helper-msi-ci/test-receipt.json -Raw | ConvertFrom-Json
          ./scripts/Test-WindowsHelperMsiInstall.ps1 -EphemeralCi -Path (Join-Path $PWD 'artifacts/windows-helper-msi-ci/first/helper.msi') -ExpectedGeneration $fixture.generation -ExpectedManifestDigest $fixture.manifest -ArtifactDirectory (Join-Path $PWD 'artifacts/windows-helper-msi-install-ci')
      - name: Upload native Windows proof receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-handle-authority-proof
          path: |
            proofs/windows-workspace-boundary/artifacts/proof-receipt.json
            proofs/windows-workspace-boundary/artifacts/signing-receipt.json
            proofs/windows-workspace-boundary/artifacts/removal/**/qualification-receipt.json
            proofs/windows-workspace-boundary/artifacts/removal/**/*.log
            proofs/windows-workspace-boundary/artifacts/removal/**/native-tests.json
            artifacts/windows-helper-msi-ci/test-receipt.json
            artifacts/windows-helper-msi-ci/*.log
            artifacts/windows-helper-msi-ci/valid.json
            artifacts/windows-helper-msi-install-ci/*.json
            artifacts/windows-helper-msi-install-ci/*.log
            artifacts/windows-coordinator-host-probe/verification-receipt.json
            artifacts/windows-coordinator-client/verification-receipt.json
            artifacts/windows-coordinator-service-source/verification-receipt.json
            artifacts/windows-coordinator-worker-slot-source/verification-receipt.json
            artifacts/windows-coordinator-v3-graph-source/qualification-*/verification-receipt.json
            artifacts/windows-coordinator-root-provisioner/run-*/verification-receipt.json
            artifacts/windows-selection-publisher-*/verification-receipt.json
            artifacts/windows-selection-custody-*/verification-receipt.json
            artifacts/windows-coordinator-git-portable/receipt-*.json
            artifacts/windows-coordinator-checkout-portable/receipt-*.json
            artifacts/windows-coordinator-v2-msi-offline/source-*/verification-receipt.json
            artifacts/windows-git-etw-tool-preflight/NEGATIVE_CONTROL_RECEIPT.json
          if-no-files-found: warn

  # Full manual-only determinism and license gate.
  determinism-and-license:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.level == 'full'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm run build
      - run: npm run format
      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code; then
            echo "❌ Repository is not clean after build and format"
            exit 1
          fi
          echo "✅ Repository is clean"
      - name: Determinism smoke test
        run: |
          rm -rf .artifactsA .artifactsB
          node dist/cli.js plan --out .artifactsA
          node dist/cli.js plan --out .artifactsB
          diff -u .artifactsA/plan.json .artifactsB/plan.json
          echo "✅ Plan generation is deterministic"
      - name: License compliance
        run: node scripts/check-license-compliance.mjs

  # Summary job
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build-and-test, git-backed-tests, package-artifacts, windows-bootstrap]
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "❌ Lint failed"; exit 1
          fi
          if [[ "${{ needs.typecheck.result }}" != "success" ]]; then
            echo "❌ TypeCheck failed"; exit 1
          fi
          if [[ "${{ needs.build-and-test.result }}" != "success" && "${{ needs.build-and-test.result }}" != "skipped" ]]; then
            echo "❌ build-and-test did not pass"; exit 1
          fi
          if [[ "${{ needs.git-backed-tests.result }}" != "success" && "${{ needs.git-backed-tests.result }}" != "skipped" ]]; then
            echo "❌ git-backed-tests did not pass"; exit 1
          fi
          if [[ "${{ needs.package-artifacts.result }}" != "success" && "${{ needs.package-artifacts.result }}" != "skipped" ]]; then
            echo "❌ package-artifacts did not pass"; exit 1
          fi
          if [[ "${{ needs.windows-bootstrap.result }}" != "success" && "${{ needs.windows-bootstrap.result }}" != "skipped" ]]; then
            echo "❌ windows-bootstrap did not pass"; exit 1
          fi
          echo "✅ CI Complete (level: ${{ inputs.level || 'pull-request' }})"
