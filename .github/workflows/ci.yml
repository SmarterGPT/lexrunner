# PR CI: lint, typecheck, build, sharded tests, Git integration, and package artifacts.
# workflow_dispatch retains lower-cost manual levels for diagnosis.
# Local equivalents:
#   minimal: npm run ci:minimal
#   standard: npm run ci
#   full: npm run ci:full
name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "src/**"
      - "tests/**"
      - "proofs/windows-workspace-boundary/**"
      - "package*.json"
      - "tsconfig*.json"
      - ".github/workflows/**"
      - "vitest.config.ts"
      - "tsup.config.ts"
  workflow_dispatch:
    inputs:
      level:
        description: "CI level to run"
        required: false
        type: choice
        options:
          - minimal
          - standard
          - full
        default: "minimal"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  # Setup job - install dependencies once, cache for all jobs
  setup:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Cache node_modules
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

  # Minimal gates: lint + typecheck (always runs)
  lint:
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm run typecheck

  # Standard gates: build + sharded test suite. Required on every non-draft PR.
  build-and-test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.level == 'standard' || inputs.level == 'full'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1/3
            artifact: 1-of-3
          - shard: 2/3
            artifact: 2-of-3
          - shard: 3/3
            artifact: 3-of-3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - name: Run test shard with JSON output
        run: npm test -- --shard=${{ matrix.shard }}
        continue-on-error: true
        id: test-run
      - name: Upload test shard result
        if: always() && steps.test-run.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.artifact }}
          path: test-results.json
          if-no-files-found: error
      - name: Fail if tests failed
        if: steps.test-run.outcome == 'failure'
        run: exit 1

  # Git-backed lifecycle and recovery coverage. Required on every non-draft PR.
  git-backed-tests:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.level == 'full')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm run build
      - run: npm run test:git

  # Build-artifact/package boundary validation. Required on every non-draft PR.
  package-artifacts:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.level == 'full')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm run build
      - run: npm run validate:package
      - run: npm run test:package
      - run: npm pack --dry-run --json > npm-pack-dry-run.json
      - uses: actions/upload-artifact@v7
        with:
          name: npm-pack-dry-run
          path: npm-pack-dry-run.json

  # Native Windows bootstrap and independently portable regressions. The full shared
  # native-host conformance lane is tracked by #893 and must not be simulated with skips.
  windows-bootstrap:
    runs-on: windows-latest
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.level != 'minimal')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: "proofs/windows-workspace-boundary/global.json"
      - name: Activate pinned npm
        run: npm install --global npm@11.16.0
      - name: Install dependencies
        run: npm ci
      - name: Verify install-script policy
        run: npm run check:install-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint and typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Run portable Windows regressions
        run: >-
          npx vitest run
          tests/unit/verification/engine-verifier.spec.ts
          tests/dogfood-ecosystem.spec.ts
          tests/release-readiness.spec.ts
          tests/runs/agent-work-containment-preflight.spec.ts
          tests/runs/agent-work-preparation-service.spec.ts
          tests/workspaces/workspace-boundary-resolver.spec.ts
          tests/workspaces/workspace-boundary.spec.ts
          tests/store/sqlite/removal-evidence-interruption.spec.ts
      - name: Run native Windows handle-authority proof
        shell: pwsh
        run: ./proofs/windows-workspace-boundary/verify.ps1
      - name: Upload native Windows proof receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-handle-authority-proof
          path: |
            proofs/windows-workspace-boundary/artifacts/proof-receipt.json
            proofs/windows-workspace-boundary/artifacts/signing-receipt.json
          if-no-files-found: warn

  # Full manual-only determinism and license gate.
  determinism-and-license:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.level == 'full'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Restore node_modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - run: npm run build
      - run: npm run format
      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code; then
            echo "❌ Repository is not clean after build and format"
            exit 1
          fi
          echo "✅ Repository is clean"
      - name: Determinism smoke test
        run: |
          rm -rf .artifactsA .artifactsB
          node dist/cli.js plan --out .artifactsA
          node dist/cli.js plan --out .artifactsB
          diff -u .artifactsA/plan.json .artifactsB/plan.json
          echo "✅ Plan generation is deterministic"
      - name: License compliance
        run: node scripts/check-license-compliance.mjs

  # Summary job
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build-and-test, git-backed-tests, package-artifacts, windows-bootstrap]
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "❌ Lint failed"; exit 1
          fi
          if [[ "${{ needs.typecheck.result }}" != "success" ]]; then
            echo "❌ TypeCheck failed"; exit 1
          fi
          if [[ "${{ needs.build-and-test.result }}" != "success" && "${{ needs.build-and-test.result }}" != "skipped" ]]; then
            echo "❌ build-and-test did not pass"; exit 1
          fi
          if [[ "${{ needs.git-backed-tests.result }}" != "success" && "${{ needs.git-backed-tests.result }}" != "skipped" ]]; then
            echo "❌ git-backed-tests did not pass"; exit 1
          fi
          if [[ "${{ needs.package-artifacts.result }}" != "success" && "${{ needs.package-artifacts.result }}" != "skipped" ]]; then
            echo "❌ package-artifacts did not pass"; exit 1
          fi
          if [[ "${{ needs.windows-bootstrap.result }}" != "success" && "${{ needs.windows-bootstrap.result }}" != "skipped" ]]; then
            echo "❌ windows-bootstrap did not pass"; exit 1
          fi
          echo "✅ CI Complete (level: ${{ inputs.level || 'pull-request' }})"
